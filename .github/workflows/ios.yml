name: iPhone build → TestFlight
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web/**', 'native/**', 'src/**', 'assets/**', 'scripts/**', 'config/**', 'migration/**', 'fonts/**', 'capacitor.config.json', 'package.json', '.github/workflows/ios.yml']
concurrency: { group: ios, cancel-in-progress: true }
permissions: { contents: write }
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Use Xcode 26 (App Store needs the iOS 26 SDK)
        run: |
          ls -d /Applications/Xcode*.app | tee -a "$RUNNER_TEMP/log.txt"
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "No Xcode 26 on this runner" | tee -a "$RUNNER_TEMP/log.txt"; exit 1; fi
          sudo xcode-select -s "$X/Contents/Developer"; xcodebuild -version | tee -a "$RUNNER_TEMP/log.txt"
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Check secrets
        env:
          A: ${{ secrets.APPLE_TEAM_ID }}
          B: ${{ secrets.ASC_KEY_ID }}
          C: ${{ secrets.ASC_ISSUER_ID }}
          D: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""; for v in A:APPLE_TEAM_ID B:ASC_KEY_ID C:ASC_ISSUER_ID D:ASC_KEY_P8; do k=${v%%:*}; n=${v#*:}; [ -z "${!k}" ] && missing="$missing $n"; done
          if [ -n "$missing" ]; then echo "Missing GitHub secrets:$missing" | tee -a "$RUNNER_TEMP/log.txt"; exit 1; fi
      - run: npm install --no-audit --no-fund 2>&1 | tee -a "$RUNNER_TEMP/log.txt"
      - name: Build the app page
        run: npm run build 2>&1 | tee -a "$RUNNER_TEMP/log.txt"
      - name: Create the iPhone project
        run: |
          set -o pipefail
          npx cap add ios 2>&1 | tee -a "$RUNNER_TEMP/log.txt"
          npx cap sync ios 2>&1 | tee -a "$RUNNER_TEMP/log.txt"
      - name: Icon and launch screen
        run: npx --yes @capacitor/assets@3 generate --ios --iconBackgroundColor '#000000' --splashBackgroundColor '#000000' --splashBackgroundColorDark '#000000'
      - name: App settings
        run: bash scripts/ios-config.sh
      - name: App Store Connect key
        env:
          KEY: ${{ secrets.ASC_KEY_P8 }}
          KID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$KEY" > ~/.appstoreconnect/private_keys/AuthKey_$KID.p8
          echo "KEYPATH=$HOME/.appstoreconnect/private_keys/AuthKey_$KID.p8" >> $GITHUB_ENV
      - name: Apple capabilities (HealthKit, extension IDs)
        env:
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
          KEY: ${{ secrets.ASC_KEY_P8 }}
        run: |
          pip3 install -q --break-system-packages pyjwt cryptography 2>/dev/null || pip3 install -q pyjwt cryptography
          python3 scripts/asc_caps.py 2>&1 | tee -a "$RUNNER_TEMP/log.txt" || true
      - name: Archive and export
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          sed "s/TEAM_ID/$TEAM/" scripts/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEYPATH" -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS")
          COMMON=(-workspace ios/App/App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive")
          VER=(CURRENT_PROJECT_VERSION=${{ github.run_number }} MARKETING_VERSION=1.0 DEVELOPMENT_TEAM="$TEAM")
          # iOS 26 SDK refuses ad-hoc signing inside xcodebuild, so archive unsigned and stamp the entitlements with codesign; export re-signs for the App Store
          SIGN=(CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO)
          sign_it(){ APP=$(ls -d "$RUNNER_TEMP"/App.xcarchive/Products/Applications/*.app | head -1); [ -d "$APP" ] || return 1
            ent(){ sed "s/\$(DEVELOPMENT_TEAM)/$TEAM/g" "$1" > "$2"; }
            for f in "$APP"/Frameworks/*; do [ -e "$f" ] && codesign -f -s - "$f" >/dev/null 2>&1; done
            for x in "$APP"/PlugIns/*.appex; do [ -d "$x" ] || continue; n=$(basename "$x" .appex); ent "ios/App/$n/$n.entitlements" "$RUNNER_TEMP/$n.ent"; codesign -f -s - --entitlements "$RUNNER_TEMP/$n.ent" "$x" || return 1; done
            ent ios/App/App/App.entitlements "$RUNNER_TEMP/app.ent"; codesign -f -s - --entitlements "$RUNNER_TEMP/app.ent" "$APP" || return 1
            codesign -d --entitlements - "$APP" 2>/dev/null | grep -oE "healthkit|keychain-access-groups" | sort -u | tr '\n' ' ' | sed 's/^/entitlements: /' | tee -a "$RUNNER_TEMP/log.txt"; echo | tee -a "$RUNNER_TEMP/log.txt"; }
          export_it(){ rm -rf "$RUNNER_TEMP/out"; xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/out" "${AUTH[@]}" > "$RUNNER_TEMP/x.txt" 2>&1; R=$?; cat "$RUNNER_TEMP/x.txt" >> "$RUNNER_TEMP/full.txt"; grep -iE "error|fail" "$RUNNER_TEMP/x.txt" | head -12 | tee -a "$RUNNER_TEMP/log.txt"; test $R -eq 0 && test -f "$RUNNER_TEMP/out/App.ipa"; }
          archive_it(){ rm -rf "$RUNNER_TEMP/App.xcarchive"; xcodebuild "${COMMON[@]}" "${AUTH[@]}" "${VER[@]}" "$@" archive > "$RUNNER_TEMP/a.txt" 2>&1; R=$?; cat "$RUNNER_TEMP/a.txt" >> "$RUNNER_TEMP/full.txt"; grep -E "error:|\*\* ARCHIVE" "$RUNNER_TEMP/a.txt" | sort -u | head -15 | tee -a "$RUNNER_TEMP/log.txt"; test $R -eq 0 && test -d "$RUNNER_TEMP/App.xcarchive"; }
          rm -rf ios.orig; cp -R ios ios.orig
          fresh(){ rm -rf ios; cp -R ios.orig ios; }
          # most features first; each step down drops the part most likely to be refused
          for T in "full yes yes" "noHealth no yes" "noWidgets yes no" "basic no no"; do
            set -- $T; echo "== try: $1 (health=$2 widgets+share=$3)" | tee -a "$RUNNER_TEMP/log.txt"; fresh
            if TEAM="$TEAM" bash scripts/ios-native.sh $2 $3 2>&1 | tee -a "$RUNNER_TEMP/log.txt" && archive_it "${SIGN[@]}" && sign_it && export_it; then echo "TIER=$1" | tee -a "$RUNNER_TEMP/log.txt"; exit 0; fi
          done
          echo "== try: plain (no native code)" | tee -a "$RUNNER_TEMP/log.txt"; fresh
          archive_it CODE_SIGN_STYLE=Automatic CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO IPHONEOS_DEPLOYMENT_TARGET=15.0 && export_it && echo "TIER=plain" | tee -a "$RUNNER_TEMP/log.txt"
      - name: Upload to TestFlight
        env:
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --upload-app -f "$RUNNER_TEMP/out/App.ipa" -t ios --apiKey "$KID" --apiIssuer "$ISS" 2>&1 | tee "$RUNNER_TEMP/up.txt" | tee -a "$RUNNER_TEMP/log.txt"
          if grep -q "UPLOAD FAILED\|ERROR:" "$RUNNER_TEMP/up.txt"; then exit 1; fi
      - name: Report status to the repo
        if: always()
        run: |
          { echo "# iPhone build #${{ github.run_number }} — ${{ job.status }}"; echo; date -u; echo; echo '```'; tail -120 "$RUNNER_TEMP/log.txt" 2>/dev/null; echo '```'; } > ci/ios-status.md
          git config user.name "tega-ci"; git config user.email "ci@users.noreply.github.com"
          git add ci/ios-status.md; git commit -m "ci: iPhone build #${{ github.run_number }} ${{ job.status }} [skip ci]" || true
          git pull --rebase -q origin main || true; git push -q origin HEAD:main || true
