name: iPhone build → TestFlight
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web/**', 'src/**', 'assets/**', 'scripts/**', 'config/**', 'capacitor.config.json', 'package.json', '.github/workflows/ios.yml']
concurrency: { group: ios, cancel-in-progress: true }
permissions: { contents: write }
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Check secrets
        env:
          A: ${{ secrets.APPLE_TEAM_ID }}
          B: ${{ secrets.ASC_KEY_ID }}
          C: ${{ secrets.ASC_ISSUER_ID }}
          D: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""; for v in A:APPLE_TEAM_ID B:ASC_KEY_ID C:ASC_ISSUER_ID D:ASC_KEY_P8; do k=${v%%:*}; n=${v#*:}; [ -z "${!k}" ] && missing="$missing $n"; done
          if [ -n "$missing" ]; then echo "Missing GitHub secrets:$missing" | tee -a "$RUNNER_TEMP/log.txt"; exit 1; fi
      - run: npm install --no-audit --no-fund 2>&1 | tee -a "$RUNNER_TEMP/log.txt"
      - name: Build the app page
        run: npm run build 2>&1 | tee -a "$RUNNER_TEMP/log.txt"
      - name: Create the iPhone project
        run: |
          set -o pipefail
          npx cap add ios 2>&1 | tee -a "$RUNNER_TEMP/log.txt"
          npx cap sync ios 2>&1 | tee -a "$RUNNER_TEMP/log.txt"
      - name: Icon and launch screen
        run: npx --yes @capacitor/assets@3 generate --ios --iconBackgroundColor '#000000' --splashBackgroundColor '#000000' --splashBackgroundColorDark '#000000'
      - name: App settings
        run: bash scripts/ios-config.sh
      - name: App Store Connect key
        env:
          KEY: ${{ secrets.ASC_KEY_P8 }}
          KID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$KEY" > ~/.appstoreconnect/private_keys/AuthKey_$KID.p8
          echo "KEYPATH=$HOME/.appstoreconnect/private_keys/AuthKey_$KID.p8" >> $GITHUB_ENV
      - name: Archive
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates -authenticationKeyPath "$KEYPATH" -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CURRENT_PROJECT_VERSION=${{ github.run_number }} MARKETING_VERSION=1.0 \
            archive 2>&1 | tee -a "$RUNNER_TEMP/log.txt" | tail -40; exit ${PIPESTATUS[0]}
      - name: Export
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          sed "s/TEAM_ID/$TEAM/" scripts/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/out" \
            -allowProvisioningUpdates -authenticationKeyPath "$KEYPATH" -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS" 2>&1 | tee -a "$RUNNER_TEMP/log.txt"; test -f "$RUNNER_TEMP/out/App.ipa"
      - name: Upload to TestFlight
        env:
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: xcrun altool --upload-app -f "$RUNNER_TEMP/out/App.ipa" -t ios --apiKey "$KID" --apiIssuer "$ISS" 2>&1 | tee -a "$RUNNER_TEMP/log.txt"
      - name: Report status to the repo
        if: always()
        run: |
          { echo "# iPhone build #${{ github.run_number }} — ${{ job.status }}"; echo; date -u; echo; echo '```'; tail -120 "$RUNNER_TEMP/log.txt" 2>/dev/null; echo '```'; } > ci/ios-status.md
          git config user.name "tega-ci"; git config user.email "ci@users.noreply.github.com"
          git add ci/ios-status.md; git commit -m "ci: iPhone build #${{ github.run_number }} ${{ job.status }} [skip ci]" || true
          git pull --rebase -q origin main || true; git push -q origin HEAD:main || true
