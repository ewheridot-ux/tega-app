name: Stretch demo videos
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ci/run-yvid', 'ci/poses.json']
concurrency: { group: yvid, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  yvid:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests
      - name: Find and verify one demo per stretch
        env:
          SUPA_SERVICE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPA_URL: https://rlgoetbrlrsdijtlwnsb.supabase.co
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/yvid.py
      - name: Keep the public list (pose id → YouTube id) for the web copy
        run: |
          [ -f out/yvid.json ] || exit 0
          cp out/yvid.json ci/yvid.json
          git config user.name "tega-bot"; git config user.email "tega-bot@users.noreply.github.com"
          git add ci/yvid.json; git diff --cached --quiet && exit 0
          git commit -q -m "ci: stretch demo list [skip ci]"; git pull -q --rebase && git push -q
