name: XP check (phone data, numbers only)
on:
  workflow_dispatch:
  push: { branches: [main], paths: ['ci/run-xpcheck'] }
permissions: { contents: write }
jobs:
  xp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: pip install -q requests && npm i -s playwright@1.47.2 && npx playwright install --with-deps chromium >/dev/null
      - name: Run
        env:
          SUPA_SERVICE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPA_URL: https://rlgoetbrlrsdijtlwnsb.supabase.co
        run: |
          mkdir -p /tmp/xp
          python scripts/xp_state.py | tee ci/xpcheck.md
          : > /tmp/xp/versions.txt
          for c in bd3cb73:b222 5c87d2e:b229 fb936ad:b230 HEAD:now; do s=${c%%:*}; n=${c##*:}; git show $s:web/app.html > /tmp/xp/$n.html && echo $n >> /tmp/xp/versions.txt; done
          node scripts/xpcheck.js | tee -a ci/xpcheck.md
          rm -rf /tmp/xp
      - name: Save
        if: always()
        run: |
          git config user.name "tega-ci"; git config user.email "ci@users.noreply.github.com"
          git add ci/xpcheck.md; git commit -qm "ci: xp check [skip ci]" || true; git pull --rebase -q origin main || true; git push -q origin HEAD:main || true
