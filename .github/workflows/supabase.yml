name: Set up the cloud database
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ci/run-supabase']
permissions: { contents: write }
jobs:
  supabase:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      DBPASS: ${{ secrets.SUPABASE_DB_PASSWORD }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Set up database, storage and the Claude function
        run: |
          set -o pipefail
          REF=$(python3 -c "import json;print(json.load(open('config/public.json'))['supabaseProjectRef'])")
          L="$RUNNER_TEMP/log.txt"
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && { echo "Missing GitHub secret SUPABASE_ACCESS_TOKEN" | tee -a $L; exit 1; }
          [ -z "$DBPASS" ] && { echo "Missing GitHub secret SUPABASE_DB_PASSWORD" | tee -a $L; exit 1; }
          supabase link --project-ref "$REF" -p "$DBPASS" 2>&1 | tee -a $L
          supabase db push -p "$DBPASS" 2>&1 | tee -a $L
          supabase functions deploy claude --project-ref "$REF" 2>&1 | tee -a $L
          if [ -n "$ANTHROPIC_API_KEY" ]; then supabase secrets set ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" --project-ref "$REF" 2>&1 | tee -a $L; else echo "ANTHROPIC_API_KEY not added yet — AI coach waits for it" | tee -a $L; fi
          echo "ALL DONE" | tee -a $L
      - name: Report status to the repo
        if: always()
        run: |
          mkdir -p ci; { echo "# Cloud database setup #${{ github.run_number }} — ${{ job.status }}"; echo; date -u; echo; echo '```'; tail -80 "$RUNNER_TEMP/log.txt" 2>/dev/null | sed -E 's/(sbp_|sk-ant-)[A-Za-z0-9_-]+/\1***/g'; echo '```'; } > ci/supabase-status.md
          git config user.name "tega-ci"; git config user.email "ci@users.noreply.github.com"
          git add ci/supabase-status.md; git commit -m "ci: database setup #${{ github.run_number }} ${{ job.status }} [skip ci]" || true
          git pull --rebase -q origin main || true; git push -q origin HEAD:main || true
