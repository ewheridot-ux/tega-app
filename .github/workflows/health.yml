name: State health (numbers only)
on:
  workflow_dispatch:
  push: { branches: [main], paths: ['ci/run-health'] }
permissions: { contents: write }
jobs:
  h:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests
      - env:
          SUPA_SERVICE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPA_URL: https://rlgoetbrlrsdijtlwnsb.supabase.co
        run: python scripts/state_health.py | tee ci/health.md
      - if: always()
        run: |
          git config user.name "tega-ci"; git config user.email "ci@users.noreply.github.com"
          git add ci/health.md; git commit -qm "ci: state health [skip ci]" || true; git pull --rebase -q origin main || true; git push -q origin HEAD:main || true
