name: tree style previews
on: { push: { branches: [tree-styles] } }
permissions: { contents: write }
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save --no-audit --no-fund playwright@1.48.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
      - run: node ci/style-shots.mjs
      - run: |
          git config user.name "tega-bot"; git config user.email "tega-bot@users.noreply.github.com"
          git add shots; git commit -q -m "ci: style previews [skip ci]" && git push -q
