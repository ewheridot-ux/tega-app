name: Bank → app (every 3h)
on:
  workflow_dispatch:
  schedule: [{ cron: '17 */3 * * *' }]
  push: { branches: [main], paths: ['ci/run-bank', 'scripts/era_pull.py'] }
concurrency: { group: feed, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests
      - name: Pull from Era
        env:
          ERA_API_KEY: ${{ secrets.ERA_API_KEY }}
          SUPA_SERVICE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPA_URL: https://rlgoetbrlrsdijtlwnsb.supabase.co
        run: python scripts/era_pull.py
      - name: Save status
        if: always()
        run: |
          git config user.name "tega-ci"; git config user.email "ci@users.noreply.github.com"
          git add ci/feed/bank_status.md 2>/dev/null || true
          git commit -qm "ci: bank [skip ci]" || true; git pull --rebase -q origin main || true; git push -q origin HEAD:main || true
