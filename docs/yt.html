<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Tega.exe video</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}#p,#p iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
#tap{position:fixed;inset:0;z-index:2;background:transparent;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
#tap i{width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;transition:opacity .2s}
#tap i:after{content:'';margin-left:5px;border-style:solid;border-width:12px 0 12px 20px;border-color:transparent transparent transparent #fff}
#tap.on i{opacity:0}</style>
</head>
<body>
<div id="p"></div>
<script>
/* Tega.exe plays YouTube demos through this page. The iPhone app runs from capacitor://, which sends YouTube no web address,
   so YouTube refuses to play (error 153). Loaded from here, the player gets a real https address and plays.
   b321: uses YouTube's player API to start the clip itself (muted), keep it looping, and retry if the phone paused it —
   the plain ?autoplay=1 link is ignored on iPhone. With no controls, a tap anywhere starts it too.
   It only takes a video id and player options from the link — no personal data. */
(function () {
  var q = new URLSearchParams(location.search), v = q.get('v') || '';
  if (!/^[A-Za-z0-9_-]{11}$/.test(v)) return;
  var num = function (k) { var n = parseInt(q.get(k), 10); return isFinite(n) && n >= 0 ? n : 0; };
  var start = num('start'), loop = q.get('loop') === '1', auto = q.get('autoplay') === '1', mute = q.get('mute') === '1', bare = q.get('controls') === '0';
  var vars = { playsinline: 1, rel: 0, modestbranding: 1, iv_load_policy: 3, enablejsapi: 1, origin: location.origin };
  if (start) vars.start = start;
  if (loop) { vars.loop = 1; vars.playlist = v; }
  if (auto) vars.autoplay = 1;
  if (mute || auto) vars.mute = 1;   // phones only start a video by itself when it's muted
  if (bare) vars.controls = 0;
  var player, tries = 0, played = false;
  function kick() { try { if (mute || auto) player.mute(); player.playVideo(); } catch (e) {} }
  if (bare) {   // no controls to press, so a tap anywhere plays it (and tells the app, which uses taps to open/close the big view)
    var t = document.createElement('div'); t.id = 'tap'; t.innerHTML = '<i></i>'; document.body.appendChild(t);   // ▶ shows until the clip is actually playing
    // b323: a tap on a clip that isn't playing yet only starts it — it never closes or opens anything; once it plays, taps go back to the app
    t.addEventListener('click', function () {
      var st = -1; try { st = player.getPlayerState(); } catch (e) {}
      if (st !== 1 && st !== 3) { kick(); return; }
      try { parent.postMessage({ tegaYt: 'tap', v: v }, '*'); } catch (e) {}
    });
  }
  window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player('p', {
      videoId: v, host: 'https://www.youtube-nocookie.com', playerVars: vars,
      events: {
        onReady: function () { if (auto) kick(); },
        onStateChange: function (e) {
          if (loop && e.data === 0) { player.seekTo(start, true); player.playVideo(); }          // ended → go round again
          if (e.data === 1) played = true;
          var tp = document.getElementById('tap'); if (tp) tp.className = e.data === 1 || e.data === 3 ? 'on' : '';
          if (auto && !played && (e.data === 2 || e.data === 5 || e.data === -1) && tries < 4) { tries++; setTimeout(kick, 400); }   // the phone held it back → nudge it (never fights your own pause)
        }
      }
    });
  };
  var s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
})();
</script>
</body>
</html>
